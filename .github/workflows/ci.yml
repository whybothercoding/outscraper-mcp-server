name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # "local tool" shape (systems/github-ci CONTRACT.md) — no engines.node
      # to pin against (never npm-published, not Vercel-deployed), single
      # consumer (whatever machine points a Claude/MCP config at this), so a
      # single current-LTS pin rather than a matrix.
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # systems/npm-dependency-policy rules 2+3 — pin an exact npm version and
      # make an unapproved install script a hard CI failure instead of npm
      # 12's silent skip.
      - name: Pin npm version
        run: npm install -g npm@12.0.2

      - name: Enforce allowScripts in CI
        run: npm config set strict-allow-scripts true

      - name: Install dependencies
        run: npm ci

      - name: Type check
        run: npm run typecheck

      - name: Build
        run: npm run build
